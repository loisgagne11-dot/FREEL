<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freel V1.11 — Outils & simulateurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="freel.css?v=9">
<link rel="stylesheet" href="v1.11.css?v=5">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('freel-v111-theme')||'sombre')}catch(e){document.documentElement.setAttribute('data-theme','sombre')}</script>
<style>
  #root{min-height:100vh;}
  .a-reveal{animation:aRise .5s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes aRise{from{transform:translateY(9px);}to{transform:none;}}
  @media (prefers-reduced-motion: reduce){.a-reveal{animation:none;transform:none;}}

  .subtabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 22px;}
  .stab{appearance:none;background:none;border:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);padding:11px 15px;cursor:pointer;position:relative;display:inline-flex;align-items:center;gap:8px;}
  .stab:hover{color:var(--text);}.stab.on{color:var(--text);}
  .stab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--green);border-radius:2px;}

  .grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;}
  .s12{grid-column:span 12;}.s7{grid-column:span 7;}.s5{grid-column:span 5;}.s6{grid-column:span 6;}.s4{grid-column:span 4;}.s8{grid-column:span 8;}
  @media(max-width:1000px){.s7,.s5,.s6,.s4,.s8{grid-column:span 12;}}

  .bigfield{margin-bottom:4px;}
  .bigfield label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:500;}
  .bigfield .inwrap{display:flex;align-items:baseline;gap:6px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:11px;padding:11px 14px;}
  .bigfield .inwrap:focus-within{border-color:var(--green);}
  .bigfield input{flex:1;min-width:0;background:none;border:none;color:var(--text);font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.02em;outline:none;}
  .bigfield .suf{font-family:var(--mono);font-size:13px;color:var(--muted);}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field2{margin-bottom:13px;}
  .field2 label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500;}
  .field2 input{width:100%;background:var(--panel-2);border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;color:var(--text);font-family:var(--mono);font-size:14px;}
  .field2 input:focus{outline:none;border-color:var(--green);}

  .compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
  .opt{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--panel-2);position:relative;transition:border-color .2s,background .2s;}
  .opt.win{border-color:rgba(84,207,145,.45);background:linear-gradient(165deg,rgba(84,207,145,.09),var(--panel-2) 70%);}
  .opt .ol{font-size:12px;color:var(--muted);font-weight:600;}
  .opt .ov{font-family:var(--mono);font-size:28px;font-weight:700;margin:8px 0 2px;letter-spacing:-.02em;}
  .opt.win .ov{color:var(--green);}
  .opt .od{font-size:12px;color:var(--muted);}
  .opt .wintag{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:10px;color:var(--green);background:var(--green-glow);border:1px solid rgba(84,207,145,.3);padding:2px 8px;border-radius:20px;}
  @media(max-width:720px){.compare{grid-template-columns:1fr;}}

  .brk{display:grid;grid-template-columns:88px 1fr 78px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);}
  .brk:last-child{border-bottom:none;}
  .brk .bt b{font-family:var(--mono);font-weight:700;}
  .brk .bt span{display:block;font-size:11px;color:var(--muted);font-family:var(--mono);}
  .brk .bbar{height:8px;border-radius:5px;background:var(--panel-3);overflow:hidden;}
  .brk .bbar i{display:block;height:100%;background:var(--green-deep);border-radius:5px;transition:width .4s;}
  .brk .bv{text-align:right;font-family:var(--mono);font-size:13px;font-weight:600;}

  .resbox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;}
  .resbox .rv{font-family:var(--mono);font-size:24px;font-weight:700;}
  .scalerow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .scalerow:last-child{border-bottom:none;}
  .scalerow .num{font-family:var(--mono);}

  .dropzone{border:1.5px dashed var(--line-2);border-radius:12px;padding:22px;text-align:center;color:var(--muted);font-size:12.5px;font-family:var(--mono);background:var(--panel-2);cursor:pointer;line-height:1.7;transition:border-color .15s,background .15s;}
  .dropzone:hover{border-color:var(--green);background:var(--green-glow);color:var(--green);}
  .dropzone svg{width:22px;height:22px;display:block;margin:0 auto 8px;}
  .matchrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:var(--panel-2);}
  .matchrow .mc{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .matchrow .mc svg{width:15px;height:15px;}
  .matchrow .mc.ok{background:var(--green-glow);color:var(--green);}
  .matchrow .mc.q{background:var(--amber-soft);color:var(--amber);}
  .matchrow .num{font-family:var(--mono);font-weight:600;}
  .minibtn{appearance:none;font-family:inherit;font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel-3);color:var(--text);cursor:pointer;}
  .minibtn:hover{background:var(--panel);}

  .craitem{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line);}
  .craitem:last-child{border-bottom:none;}
  .craitem .ci{width:34px;height:34px;border-radius:9px;background:var(--green-glow);color:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .craitem .ci svg{width:16px;height:16px;}
  .craitem .cm{flex:1;min-width:0;}
  .craitem .cm b{font-size:13.5px;font-weight:600;display:block;}
  .craitem .cm span{font-size:12px;color:var(--muted);}
  .launch{display:flex;flex-direction:column;align-items:flex-start;gap:14px;border:1px solid rgba(84,207,145,.25);border-radius:16px;background:radial-gradient(130% 130% at 100% 0%,var(--green-glow),var(--panel) 62%);padding:24px;}
  .launch h3{margin:0;font-size:19px;letter-spacing:-.01em;}
  .launch p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.6;max-width:48ch;}
  .rng{width:100%;accent-color:var(--green);cursor:pointer;}
</style>
</head>
<body>
<div id="root"></div>
<script>
window.FREEL_ICONS={
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>',
  layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 14 9 5 9-5"/></svg>'
};
window.FreelToast=function(msg,kind){
  var t=document.createElement('div');t.className='freel-toast'+(kind?(' '+kind):'');
  t.innerHTML=(kind==='ok'?FREEL_ICONS.check:FREEL_ICONS.layers)+'<span>'+msg+'</span>';
  document.body.appendChild(t);requestAnimationFrame(function(){t.classList.add('show');});
  setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove();},250);},2600);
};
</script>
