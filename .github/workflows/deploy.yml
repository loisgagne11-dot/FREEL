# Chaque action est épinglée par l'empreinte complète de son commit, la version
# en commentaire. Une étiquette (`@v5`) se déplace : qui la réécrit fait
# exécuter son code ici, avec le droit de publier le site — c'est arrivé à
# `tj-actions/changed-files` en mars 2025, sur des milliers de dépôts. Une
# empreinte ne bouge pas ; la veille de `.github/dependabot.yml` propose les
# montées, une à une, en revue.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Audit des dépendances servies (bloquant)
        working-directory: app
        run: npm audit --omit=dev

      - name: Install the browser for the checks
        working-directory: app
        run: npx playwright install --with-deps chromium

      # Le `verifier` COMPLET passe avant le déploiement. Publier une version
      # dont les calculs échouent serait pire que ne rien publier : les
      # chiffres se retrouvent dans des déclarations. Jusqu'au lot 56, seuls le
      # typage et les tests passaient ici — la politique de contenu, les
      # budgets et la confidentialité n'étaient contrôlés qu'en local.
      - name: Verifier
        working-directory: app
        run: npm run verifier

      # Reconstruit après les contrôles : le site publié est tiré d'un `dist`
      # produit par le build ordinaire, pas de ce qu'un contrôle aurait laissé.
      - name: Build the new app
        working-directory: app
        run: npm run build

      # Répertoire de publication construit explicitement, plutôt que d'envoyer
      # la racine du dépôt telle quelle : celle-ci contient app/ avec ses
      # node_modules et ses sources, qui n'ont rien à faire en ligne.
      #
      # La bascule (lot 24) : la nouvelle application à la racine, l'ancienne
      # sous /legacy/ en lecture seule, /v2/ redirigé vers la racine. Le détail
      # — et la raison de chaque choix — vit dans le script, qui est aussi
      # celui que `npm run verifier:bascule` éprouve dans un navigateur.
      - name: Assemble the site
        run: |
          set -euo pipefail
          node app/scripts/assembler-site.mjs _site
          echo "Contenu publié :"
          find _site -maxdepth 2 -type f -name '*.html' | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
