name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      # Le noyau fiscal et la migration passent avant le déploiement. Publier
      # une version dont les calculs échouent serait pire que ne rien publier :
      # les chiffres se retrouvent dans des déclarations.
      - name: Typecheck and test the new app
        working-directory: app
        run: npm run typecheck && npm test

      - name: Build the new app
        working-directory: app
        run: npm run build

      # Répertoire de publication construit explicitement, plutôt que d'envoyer
      # la racine du dépôt telle quelle : celle-ci contient app/ avec ses
      # node_modules et ses sources, qui n'ont rien à faire en ligne.
      #
      # La bascule (lot 24) : la nouvelle application à la racine, l'ancienne
      # sous /legacy/ en lecture seule, /v2/ redirigé vers la racine. Le détail
      # — et la raison de chaque choix — vit dans le script, qui est aussi
      # celui que `npm run verifier:bascule` éprouve dans un navigateur.
      - name: Assemble the site
        run: |
          set -euo pipefail
          node app/scripts/assembler-site.mjs _site
          echo "Contenu publié :"
          find _site -maxdepth 2 -type f -name '*.html' | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
