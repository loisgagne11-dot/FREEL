# Chaque action est épinglée par l'empreinte complète de son commit, la version
# en commentaire. Une étiquette (`@v5`) se déplace : qui la réécrit fait
# exécuter son code ici, avec le droit de publier le site — c'est arrivé à
# `tj-actions/changed-files` en mars 2025, sur des milliers de dépôts. Une
# empreinte ne bouge pas ; la veille de `.github/dependabot.yml` propose les
# montées, une à une, en revue.

name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Lire le dépôt, rien d'autre. Sans ce bloc, le jeton du flux recevait les
# droits par défaut du dépôt — écriture comprise selon son réglage — pendant
# qu'il exécute `npm ci`, donc le code de chaque dépendance installée.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Le jeton ne reste pas dans `.git/config` après l'extraction :
          # aucune étape n'a à pousser, et une dépendance pourrait le lire.
          persist-credentials: false

      - name: Check file size
        run: |
          SIZE=$(stat -f%z index.html 2>/dev/null || stat -c%s index.html)
          echo "index.html size: $SIZE bytes ($(($SIZE / 1024))KB)"
          if [ "$SIZE" -gt 2097152 ]; then
            echo "::warning::index.html exceeds 2MB ($SIZE bytes)"
          fi

      - name: Security scan - dangerous patterns
        run: |
          ERRORS=0
          # Check for eval() usage
          if grep -n 'eval(' index.html | grep -v '// ' | grep -v 'SPRINT'; then
            echo "::error::eval() detected - potential code injection"
            ERRORS=$((ERRORS + 1))
          fi
          # Check for document.write (exclude minified vendor libs like jsPDF)
          if grep -n 'document\.write(' index.html | grep -v 'jsPDF\|@license\|function.*var.*var.*var'; then
            echo "::error::document.write() detected"
            ERRORS=$((ERRORS + 1))
          fi
          # Check for hardcoded secrets
          if grep -n 'password.*=' index.html | grep -v 'getElementById\|value\|\.password\|placeholder\|type.*password\|auth\.\|label'; then
            echo "::warning::Possible hardcoded credential detected"
          fi
          echo "Security scan completed with $ERRORS errors"
          exit $ERRORS

      - name: Validate HTML structure
        run: |
          # Check that critical elements exist
          grep -q '<html' index.html || { echo "::error::Missing <html> tag"; exit 1; }
          grep -q '</html>' index.html || { echo "::error::Missing </html> tag"; exit 1; }
          grep -q 'function compute()' index.html || { echo "::error::Missing compute() function"; exit 1; }
          grep -q 'function render()' index.html || { echo "::error::Missing render() function"; exit 1; }
          grep -q 'function escapeHTML(' index.html || { echo "::error::Missing escapeHTML() function"; exit 1; }
          grep -q 'LEGAL_BY_YEAR' index.html || { echo "::error::Missing LEGAL_BY_YEAR"; exit 1; }
          echo "HTML structure validation passed"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Run smoke tests
        run: node tests/smoke-test.js

      # La nouvelle application est vérifiée ICI, sur les pull requests, et
      # non seulement au déploiement. Sans cela le vert de cette validation ne
      # dirait rien de app/ : une régression du noyau fiscal ne serait
      # découverte qu'après la fusion, une fois sur main.
      - name: Install app dependencies
        working-directory: app
        run: npm ci

      # Ce qui est SERVI ne porte aucune vulnérabilité connue : bloquant. Le
      # moindre signalement arrête la validation — React, Zustand et ce
      # qu'ils tirent finissent dans la page de l'utilisateur.
      - name: Audit des dépendances servies (bloquant)
        working-directory: app
        run: npm audit --omit=dev

      # L'outillage (Vite, Vitest, ESLint) ne part pas en ligne : son audit
      # s'affiche sans bloquer. Le bloquer arrêterait toute fusion le jour où
      # une alerte paraît sur un outil sans correctif — la veille de
      # Dependabot propose la montée, la revue la tranche.
      - name: Audit de l'outillage (informatif)
        working-directory: app
        run: npm audit || echo "::warning::npm audit signale des alertes dans l'outillage (voir ci-dessus)"

      # Le navigateur de la version de Playwright verrouillée : les contrôles
      # responsive, vitesse, bascule et migration s'exécutent dans une page.
      - name: Install the browser for the checks
        working-directory: app
        run: npx playwright install --with-deps chromium

      # Le `verifier` complet, et non plus le typage et les tests seuls : un
      # budget dépassé, un écran qui déborde à 390 px ou une fuite de donnée
      # n'étaient vus qu'en local — par qui pensait à le lancer.
      - name: Verifier (typage, tests, build, budgets, responsive, confidentialité…)
        working-directory: app
        run: npm run verifier

      - name: Check no secrets committed
        run: |
          # Check for .env files
          if [ -f .env ]; then echo "::error::.env file committed!"; exit 1; fi
          if [ -f .env.local ]; then echo "::error::.env.local file committed!"; exit 1; fi
          echo "No secrets found"
