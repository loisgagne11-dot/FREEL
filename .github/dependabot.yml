# Veille des dépendances (lot 56, constat S2 de `docs/AUDIT-SECURITE.md`).
#
# Les actions sont épinglées par empreinte : sans veille, elles ne bougeraient
# plus jamais, correctifs de sécurité compris. Dependabot propose chaque
# montée en pull request, que la validation éprouve et que le propriétaire
# fusionne — rien ne monte tout seul.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      # React et React DOM montent ENSEMBLE : React refuse de tourner quand
      # leurs versions diffèrent. Montés chacun dans sa PR (14/11, #330 et
      # #331), chacun était rouge par construction, et aucun ne pouvait
      # passer seul.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      # Les outils montent ensemble, en une PR : une par paquet noierait les
      # alertes qui comptent — celles des dépendances servies, qui restent
      # séparées. Mineures et correctifs seulement : une version majeure
      # mêlée au groupe (#328) cassait la résolution des pairs de
      # typescript-eslint, et bloquait avec elle huit montées sans risque.
      # Une majeure arrive seule, et se lit seule.
      outillage:
        dependency-type: development
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
